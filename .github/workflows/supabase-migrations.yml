name: Supabase-Migrationen

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/test/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - name: Test-DB aufbauen und Migrationen anwenden
        run: supabase/test/reset.sh
      - name: Tests
        run: for t in supabase/test/test_*.sh; do echo "== $t"; bash "$t"; done

  apply:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neue Migrationen in Supabase einspielen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase/deploy/apply.sh
