<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browsergame – Entwicklung</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#111827,#1f2937);color:#f9fafb}.card{max-width:680px;margin:24px;padding:40px;border:1px solid #374151;border-radius:22px;background:#111827cc;box-shadow:0 24px 70px #0008}h1{margin:0 0 12px;font-size:clamp(2rem,7vw,4rem)}p{font-size:1.1rem;line-height:1.65;color:#d1d5db}.status{display:inline-flex;gap:10px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:999px;background:#052e16;color:#86efac}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 16px #22c55e}
  </style>
</head>
<body>
  <main class="card">
    <h1>Browsergame</h1>
    <p>Die Online-Entwicklungsumgebung läuft. Ab jetzt werden neue Versionen automatisch über GitHub und Vercel veröffentlicht.</p>
    <div class="status"><span class="dot"></span>Testserver online</div>
  </main>
</body>
</html>
